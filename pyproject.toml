[project]
name = "piko"
version = "0.1.0"
description = "Self-hostable family safety platform"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.28,<1",
  "pywebpush>=2.5,<3",
  "bcrypt>=4.2,<5",
  "email-validator>=2.2,<3",
]
test = [
  "httpx>=0.28,<1",
]
mcp = [
  "mcp>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
extend-exclude = [".claude", ".tools", ".venv"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
