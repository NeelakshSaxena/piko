[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# The database URL and schema come from PIKO_DATABASE_URL / PIKO_DB_SCHEMA (never stored here).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
