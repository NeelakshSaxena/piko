name: Android APK & CI

# Builds, tests, and publishes a downloadable Android debug APK as a workflow artifact.
# Also verifies backend, web, and contract checks on push, pull_request, or manual trigger.
# Actions pinned to immutable commit SHAs with comments for provenance.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@2834e5694b5ed7dd28e473333b8793390236db79 # v4.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@dbbdc201f5931468e9ff3fc73017a61099e285a8 # v4.3.0
        with:
          gradle-version: "9.8.1"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK Artifact
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::APK file $APK_FILE does not exist!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          if [ "$SIZE" -le 1000000 ]; then
            echo "::error::APK file $APK_FILE is unexpectedly small ($SIZE bytes)!"
            exit 1
          fi
          echo "Verified APK: $APK_FILE ($SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: piko-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  backend-check:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: piko_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PIKO_ENV: test
      PIKO_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/piko_ci
      PIKO_DB_SCHEMA: piko
      PIKO_JWT_PRIVATE_KEY_FILE: .data/keys/jwt_private.pem
      PIKO_HMAC_KEY_FILE: .data/keys/hmac.key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Generate throwaway keys
        run: python -m app.cli generate-keys
        working-directory: backend
        env:
          PYTHONPATH: backend
      - name: Lint and typing
        run: |
          ruff format --check backend
          ruff check backend
          mypy backend/app
      - name: Tests
        run: pytest backend/tests -q

  web-check:
    name: Web Dashboard Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
          VITE_TILE_URL: "off"
      - run: npm audit --omit=dev
