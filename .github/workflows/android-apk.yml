name: Android APK & CI

# On every push (any branch), pull request and manual run: JVM tests and Android lint must pass, then the debug APK and
# a minified RELEASE candidate are built from this exact commit and uploaded as ONE artifact (30 days) together with
# SHA256SUMS.txt, the R8 mapping and build-metadata.json (commit, variant, version code, signed or not).
# The release APK is UNSIGNED: this workflow holds no production signing key and never creates one. The debug APK is
# debug-signed (installable for testing; not a Play Store build). No provider API key is read or embedded.
# Nothing is published automatically: the android-latest pre-release is refreshed only by a manual run that ticks
# "publish_rolling_debug_apk". Also verifies backend and web on push, PR, or manual trigger.
# Actions pinned to immutable commit SHAs with comments for provenance.

on:
  workflow_dispatch:
    inputs:
      publish_rolling_debug_apk:
        description: Also refresh the android-latest pre-release with this build's debug APK
        type: boolean
        default: false
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, deployment]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Test, Lint & Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          gradle-version: "9.8.1"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Tests and lint gate the build: nothing below runs (and no APK is uploaded) if either fails.
      - name: Run JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # versionCode = run number. The CI debug key is generated fresh on every runner, so Android will not install one
      # build over another: uninstall first. No provider key, signing key or other secret
      # is read by these steps; live-data keys live only on the server (docs/SELF_HOSTING.md).
      - name: Assemble Debug APK and minified Release APK
        env:
          PIKO_API_URL: ${{ vars.PIKO_API_URL || 'https://piko-api-ten.vercel.app' }}
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          -Ppiko.versionCode=${{ github.run_number }}
          "-Ppiko.defaultServer=$PIKO_API_URL"

      - name: Collect APKs, checksums and build metadata
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT=dist
          mkdir -p "$OUT"
          DEBUG_SRC="app/build/outputs/apk/debug/app-debug.apk"
          # With no signing configuration the release variant is, by design, unsigned (not installable as-is).
          REL_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          for f in "$DEBUG_SRC" "$REL_SRC"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            SIZE=$(stat -c%s "$f")
            [ "$SIZE" -gt 1000000 ] || { echo "::error::$f is unexpectedly small ($SIZE bytes)"; exit 1; }
          done
          cp "$DEBUG_SRC" "$OUT/piko-debug-signed-${SHA:0:12}.apk"
          cp "$REL_SRC" "$OUT/piko-release-UNSIGNED-minified-${SHA:0:12}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$OUT/r8-mapping-${SHA:0:12}.txt"
          (cd "$OUT" && sha256sum *.apk r8-mapping-*.txt > SHA256SUMS.txt)
          cat > "$OUT/build-metadata.json" <<EOF
          {
            "commit": "$SHA",
            "ref": "$REF_NAME",
            "run_number": $RUN,
            "version_code": $RUN,
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": {
              "piko-debug-signed-${SHA:0:12}.apk": {"variant": "debug", "minified": false, "signed": "debug key (testing only)"},
              "piko-release-UNSIGNED-minified-${SHA:0:12}.apk": {"variant": "release", "minified": true, "signed": false}
            },
            "notes": "The release APK is an unsigned release candidate: it cannot be installed until it is signed with a production key, which this workflow never holds. Neither APK contains a provider API key."
          }
          EOF
          cat "$OUT/SHA256SUMS.txt"

      - name: Upload APKs, checksums and metadata
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: piko-android-${{ github.sha }}
          path: android/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  publish-rolling-debug:
    # Opt-in only: runs when a person starts the workflow by hand and ticks the box; never on a push or pull request.
    name: Publish rolling debug APK (manual, opt-in)
    needs: android-apk
    if: github.event_name == 'workflow_dispatch' && inputs.publish_rolling_debug_apk && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deployment')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # creates/updates the single android-latest pre-release; nothing else in this workflow can
    steps:
      - name: Download the build's artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: piko-android-${{ github.sha }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          cp "dist/piko-debug-signed-${SHA:0:12}.apk" piko-latest.apk
          NOTES="Debug-signed build #$RUN of commit ${SHA:0:7} from ${GITHUB_REF_NAME}, published by hand. For testing; Android will ask you to allow installs from this source."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest piko-latest.apk --clobber
            gh release edit android-latest --notes "$NOTES" --target "$SHA"
          else
            gh release create android-latest piko-latest.apk --prerelease --title "Latest Android APK" --notes "$NOTES" --target "$SHA"
          fi

  backend-check:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: piko_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PIKO_ENV: test
      PIKO_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/piko_ci
      PIKO_DB_SCHEMA: piko
      PIKO_JWT_PRIVATE_KEY_FILE: .data/keys/jwt_private.pem
      PIKO_HMAC_KEY_FILE: .data/keys/hmac.key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Generate throwaway keys
        run: python -m app.cli generate-keys
        working-directory: backend
        env:
          PYTHONPATH: backend
      - name: Lint and typing
        run: |
          ruff format --check backend
          ruff check backend
          mypy backend/app
      - name: Tests
        run: |
          set -o pipefail
          pytest backend/tests -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -25 | while IFS= read -r line; do echo "::error title=pytest::${line:0:400}"; done

  web-check:
    name: Web Dashboard Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
          VITE_TILE_URL: "off"
      - run: npm audit --omit=dev
