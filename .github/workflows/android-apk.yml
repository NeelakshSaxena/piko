name: Android APK & CI

# Builds and tests the Android app on EVERY push (any branch) and uploads the debug APK as a workflow artifact
# named with the commit. Pushes to main/deployment also refresh a rolling "android-latest" pre-release so the
# newest APK always has one stable download link. Also verifies backend and web on push, PR, or manual trigger.
# The APK is debug-signed (installable for testing; not a Play Store build).
# Actions pinned to immutable commit SHAs with comments for provenance.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, deployment]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build & Package Android APK
    permissions:
      contents: write  # for the "Publish rolling latest APK" step only (creates/updates one release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          gradle-version: "9.8.1"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        # versionCode = run number, so each build installs over the last; the child only types a pairing code.
        run: >-
          ./gradlew :app:assembleDebug --no-daemon
          -Ppiko.versionCode=${{ github.run_number }}
          -Ppiko.defaultServer=${{ vars.PIKO_API_URL || 'https://piko-api-ten.vercel.app' }}

      - name: Verify APK Artifact
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::APK file $APK_FILE does not exist!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          if [ "$SIZE" -le 1000000 ]; then
            echo "::error::APK file $APK_FILE is unexpectedly small ($SIZE bytes)!"
            exit 1
          fi
          echo "Verified APK: $APK_FILE ($SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: piko-android-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling latest APK (main and deployment only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deployment')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk piko-latest.apk
          NOTES="Debug-signed build #$RUN of commit ${SHA:0:7} from ${GITHUB_REF_NAME}. For testing; Android will ask you to allow installs from this source."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest piko-latest.apk --clobber
            gh release edit android-latest --notes "$NOTES" --target "$SHA"
          else
            gh release create android-latest piko-latest.apk --prerelease --title "Latest Android APK" --notes "$NOTES" --target "$SHA"
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  backend-check:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: piko_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PIKO_ENV: test
      PIKO_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/piko_ci
      PIKO_DB_SCHEMA: piko
      PIKO_JWT_PRIVATE_KEY_FILE: .data/keys/jwt_private.pem
      PIKO_HMAC_KEY_FILE: .data/keys/hmac.key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Generate throwaway keys
        run: python -m app.cli generate-keys
        working-directory: backend
        env:
          PYTHONPATH: backend
      - name: Lint and typing
        run: |
          ruff format --check backend
          ruff check backend
          mypy backend/app
      - name: Tests
        run: |
          set -o pipefail
          pytest backend/tests -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -25 | while IFS= read -r line; do echo "::error title=pytest::${line:0:400}"; done

  web-check:
    name: Web Dashboard Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
          VITE_TILE_URL: "off"
      - run: npm audit --omit=dev
