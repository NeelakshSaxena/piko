name: ci

# Verification only. Nothing here deploys, publishes or needs a secret: the database is a throwaway
# PostgreSQL service container, keys are generated for the run, and the token is read-only.
# NOT YET RUN: this file was written without access to GitHub (see docs/DEPLOYMENT.md). Action versions
# are major tags; pin them to commit SHAs once the repository owner has reviewed them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: piko_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PIKO_ENV: test
      PIKO_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/piko_ci
      PIKO_DB_SCHEMA: piko
      PIKO_JWT_PRIVATE_KEY_FILE: .data/keys/jwt_private.pem
      PIKO_HMAC_KEY_FILE: .data/keys/hmac.key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (locked versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Generate throwaway keys
        run: python -m app.cli generate-keys
        working-directory: backend
        env:
          PYTHONPATH: backend
      - name: Lint and types
        run: |
          ruff format --check backend
          ruff check backend
          mypy backend/app
      - name: Tests
        run: pytest backend/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
          VITE_TILE_URL: "off"
      - run: npm audit --omit=dev

  android-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: JVM unit tests (no emulator, no Firebase settings needed)
        run: gradle :app:testDebugUnitTest --no-daemon
